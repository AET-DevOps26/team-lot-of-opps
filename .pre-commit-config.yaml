# Pre-commit hooks for the TaxForward repo.
#   Install once:   pip install -r requirements-dev.txt && pre-commit install
#   Run on demand:  pre-commit run -a
#
# Lints the OpenAPI single source of truth (api/openapi.yaml) on every commit
# that touches the spec or its Redocly config. Never merge spec changes without
# a passing lint. See https://pre-commit.com and https://redocly.com/docs/cli/
#
# The Redocly CLI version below is the single source of truth for the linter —
# pre-commit installs it in its own isolated, cached environment, so no global
# install or `npm ci` is required. CI runs this same hook (see
# .github/workflows/openapi-lint.yml) so local and CI always agree.
repos:
  - repo: local
    hooks:
      - id: openapi-lint
        name: Lint OpenAPI spec (Redocly)
        entry: redocly lint api/openapi.yaml
        language: node
        additional_dependencies:
          - "@redocly/cli@1.34.15"
        files: ^(api/openapi\.yaml|\.redocly\.yaml)$
        pass_filenames: false
