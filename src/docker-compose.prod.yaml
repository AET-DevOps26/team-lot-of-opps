services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - network
    restart: unless-stopped

  auth-service:
    image: ${REGISTRY}/auth-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: auth-service
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
    volumes:
      - ./firebase-sa.json:/app/firebase-service-account.json:ro
    networks:
      - network
    restart: unless-stopped

  invoice-service:
    image: ${REGISTRY}/invoice-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: invoice-service
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-invoice:5432/invoice_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_INVOICE_PASSWORD}
      - STORAGE_LOCATION=${STORAGE_LOCATION:-/app/uploads}
      - UPLOAD_MAX_SIZE_BYTES=${UPLOAD_MAX_SIZE_BYTES}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHAT_URL=${LLM_CHAT_URL}
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db-invoice:
        condition: service_healthy
      llm-chat:
        condition: service_healthy
    restart: unless-stopped

  llm-chat:
    image: ${REGISTRY}/llm-chat:${IMAGE_TAG}
    platform: linux/amd64
    container_name: llm-chat
    environment:
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${DB_LLM_CHAT_PASSWORD}@db-llm-chat:5432/llm_db
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      db-llm-chat:
        condition: service_healthy
    restart: unless-stopped

  suggestions-service:
    image: ${REGISTRY}/suggestions-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: suggestions-service
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-suggestions:5432/suggestions_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_SUGGESTIONS_PASSWORD}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - INVOICE_SERVICE_URL=${INVOICE_SERVICE_URL}
      - SUGGESTIONS_INVOICE_LIMIT=${SUGGESTIONS_INVOICE_LIMIT}
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db-suggestions:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG}
    platform: linux/amd64
    container_name: frontend
    networks:
      - network
    depends_on:
      - traefik
    restart: unless-stopped

  db-invoice:
    platform: linux/amd64
    image: postgres:16
    container_name: db-invoice
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_INVOICE_PASSWORD}
      - POSTGRES_DB=invoice_db
    volumes:
      - postgres_invoice:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d invoice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-llm-chat:
    platform: linux/amd64
    image: pgvector/pgvector:pg16
    container_name: db-llm-chat
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_LLM_CHAT_PASSWORD}
      - POSTGRES_DB=llm_db
    volumes:
      - postgres_llm_chat:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d llm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-suggestions:
    platform: linux/amd64
    image: postgres:16
    container_name: db-suggestions
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_SUGGESTIONS_PASSWORD}
      - POSTGRES_DB=suggestions_db
    volumes:
      - postgres_suggestions:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d suggestions_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_invoice:
  postgres_llm_chat:
  postgres_suggestions:

networks:
  network:
    driver: bridge
