spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

storage.location=${STORAGE_LOCATION:./uploads}
upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:10485760}

ai.backend.url=${AI_BACKEND_URL:http://localhost:8081/extract}

jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-base64-encoded-secret-at-least-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
