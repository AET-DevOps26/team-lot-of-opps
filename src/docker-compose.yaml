services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - network
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      - FIREBASE_AUTH_EMULATOR_HOST=${FIREBASE_AUTH_EMULATOR_HOST:-}
    volumes:
      - ./auth-service/devops-25c9a-firebase-adminsdk-fbsvc-d15365a6ac.json:/app/firebase-service-account.json:ro
    networks:
      - network
    restart: unless-stopped


  llm-chat:
    platform: linux/amd64
    build:
      context: ./llm-chat
      dockerfile: Dockerfile.dev
    container_name: llm-chat
    ports:
      - "8082:8081"
    environment:
      - LLM_URL=http://host.docker.internal:1234
      - LLM_MODEL=google/gemma-4-e2b
      - DATABASE_URL=postgresql://appuser:password@db-llm-chat:5432/llm_db
    volumes:
      - ./llm-chat/app:/app/app
    networks:
      - network
    depends_on:
      db-llm-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  invoice-service:
    platform: linux/amd64
    build:
      context: ./invoice-service
      dockerfile: Dockerfile.dev
    container_name: invoice-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-invoice:5432/invoice_db
      - LLM_URL=http://host.docker.internal:1234
      - LLM_MODEL=google/gemma-4-e2b
      - LLM_CHAT_URL=http://llm-chat:8081
    volumes:
      - ./invoice-service/src:/app/src
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db-invoice:
        condition: service_healthy
      llm-chat:
        condition: service_healthy
    restart: unless-stopped

  suggestions-service:
    platform: linux/amd64
    build:
      context: ./suggestions-service
      dockerfile: Dockerfile.dev
    container_name: suggestions-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-suggestions:5432/suggestions_db
      - LLM_URL=http://host.docker.internal:1234
      - LLM_MODEL=google/gemma-4-e2b
      - INVOICE_SERVICE_URL=http://invoice-service:8080
    volumes:
      - ./suggestions-service/src:/app/src
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db-suggestions:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

  db-invoice:
    platform: linux/amd64
    image: postgres:16
    container_name: db-invoice
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=invoice_db
    volumes:
      - postgres_invoice:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d invoice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-llm-chat:
    platform: linux/amd64
    image: pgvector/pgvector:pg16
    container_name: db-llm-chat
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=llm_db
    volumes:
      - postgres_llm_chat:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d llm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-suggestions:
    platform: linux/amd64
    image: postgres:16
    container_name: db-suggestions
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=suggestions_db
    volumes:
      - postgres_suggestions:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d suggestions_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_API_TARGET=http://traefik:80
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - network
    depends_on:
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_invoice:
  postgres_llm_chat:
  postgres_suggestions:

networks:
  network:
    driver: bridge
