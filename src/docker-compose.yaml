services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - network
    restart: unless-stopped
    environment:
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_MODEL_VISION=qwen3.5
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      until ollama list >/dev/null 2>&1; do sleep 1; done &&
      ollama list | grep -q \"$${OLLAMA_MODEL}\" || ollama pull $${OLLAMA_MODEL} &&
      wait"

  ai:
    platform: linux/amd64
    build:
      context: ./ai-components
      dockerfile: Dockerfile.dev
    container_name: ai
    ports:
      - "8081:8081"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_URL_VISION=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_MODEL_VISION=qwen3.5
      - LITELLM_SSL_VERIFY=False
      - DATABASE_URL=postgresql://appuser:password@db:5432/app_db
    volumes:
      - ./ai-components/app:/app/app
    networks:
      - network
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=backend
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/app_db
      - AI_BACKEND_URL=http://ai:8081
    volumes:
      - ./backend/src:/app/src
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_API_TARGET=http://backend:8080
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_DEV_AUTO_LOGIN=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  network:
    driver: bridge
