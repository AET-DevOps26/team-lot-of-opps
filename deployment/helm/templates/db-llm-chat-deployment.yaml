apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taxforward.fullname" . }}-db-llm-chat
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-llm-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-llm-chat
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "taxforward.labels" . | nindent 8 }}
        app.kubernetes.io/name: db-llm-chat
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.dbLlmChat.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.dbLlmChat.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taxforward.fullname" . }}-secret
                  key: dbLlmChatPassword
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.dbLlmChat.user }}
                - -d
                - {{ .Values.dbLlmChat.name }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.dbLlmChat.user }}
                - -d
                - {{ .Values.dbLlmChat.name }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources.dbLlmChat | nindent 12 }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "taxforward.fullname" . }}-db-llm-chat-data
