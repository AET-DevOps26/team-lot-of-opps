apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taxforward.fullname" . }}-db-invoice-data
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-invoice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.dbInvoice.size | quote }}
