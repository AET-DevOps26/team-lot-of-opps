# Central OTLP hub: every service pushes metrics + traces + logs here, the collector
# fans out to Prometheus (metrics, scraped off :8889), Jaeger (traces) and Loki (logs).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true          # in-cluster plaintext; TLS terminates at the mesh/ingress
  prometheus:
    endpoint: 0.0.0.0:8889    # Prometheus scrapes this (see prometheus/prometheus.yml)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
