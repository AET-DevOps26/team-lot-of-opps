# Jaeger v2 all-in-one trace store. Collector-based: ingests OTLP from the
# otel-collector, in-memory storage (traces are ephemeral, fine here). Grafana
# reads it via the Jaeger datasource; the UI is on :16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.9.0
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
