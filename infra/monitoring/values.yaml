kube-prometheus-stack:
  # Privileged per-node DaemonSet; not runnable on the shared AET cluster.
  nodeExporter:
    enabled: false
  prometheus-node-exporter:
    enabled: false

  # Rancher project quota rejects pods without limits; chart defaults set none.
  prometheusOperator:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "256Mi"

  kube-state-metrics:
    # Without an allowlist, kube_pod_labels carries no label_* columns.
    metricLabelsAllowlist:
      - pods=[app.kubernetes.io/name,app.kubernetes.io/version]
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "50m"
        memory: "128Mi"

  prometheus:
    prometheusSpec:
      # Discover ServiceMonitors from all namespaces, not just the chart's own
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}

      ruleSelectorNilUsesHelmValues: false
      ruleNamespaceSelector: {}
      ruleSelector: {}
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: csi-rbd-sc
            resources:
              requests:
                storage: 5Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      # Mounted at /etc/alertmanager/secrets/telegram-bot-token/token. Created by
      # deploy-observability.yml from the TELEGRAM_BOT_TOKEN repo secret; the token
      # never passes through --set, which would leak it into `helm get values`.
      secrets:
        - telegram-bot-token
      resources:
        requests:
          cpu: "25m"
          memory: "64Mi"
        limits:
          cpu: "50m"
          memory: "128Mi"
    config:
      route:
        group_by: ["alertname", "job"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: telegram
        routes:
          # kube-prometheus-stack's Watchdog fires permanently by design as a
          # dead-man's switch; routing it to Telegram would be constant spam.
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            # "TaxForwardTeam" group. Plain group, not a supergroup: if Telegram ever
            # promotes it, this id changes to a -100... form and alerts stop silently.
            - chat_id: -5461258895
              bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
              parse_mode: HTML
              send_resolved: true
              # Rendered by Alertmanager, not Helm (alertmanager.tplConfig is false),
              # so these braces must survive into the generated Secret verbatim.
              message: |-
                <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
                {{ range .Alerts }}{{ .Annotations.summary }}
                {{ end }}

  grafana:
    # adminPassword is NOT set here (kept out of git) — injected via --set from the
    # GRAFANA_ADMIN_PASSWORD secret in deploy-observability.yml. Without this the chart
    # generates a random password no one knows.
    adminUser: admin
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
    persistence:
      enabled: true
      storageClassName: csi-rbd-sc
      size: 2Gi
    "grafana.ini":
      server:
        # Reached through the app's Traefik at /grafana (see infra/helm/templates/traefik-configmap.yaml).
        domain: taxforward-devops-ss26.stud.k8s.aet.cit.tum.de
        root_url: "%(protocol)s://%(domain)s/grafana/"
        serve_from_sub_path: true
      # The /grafana route has no auth middleware in front of it, so Grafana's own login
      # is the only gate — make sure anonymous access is off.
      "auth.anonymous":
        enabled: false
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL   # pick up dashboard ConfigMaps from the app namespace too
    additionalDataSources:
      - name: Loki
        uid: loki                    # dashboard log panel references this uid explicitly
        type: loki
        access: proxy
        url: http://monitoring-loki:3100   # loki-stack service name is release-prefixed
        jsonData:
          maxLines: 1000

loki-stack:
  loki:
    isDefault: false   # loki-stack ships its own Loki datasource defaulted to true, conflicts with kube-prometheus-stack's default Prometheus one
    persistence:
      enabled: true
      storageClassName: csi-rbd-sc
      size: 5Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
  promtail:
    enabled: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    config:
      clients:
        # Chart default templates to http://{{ .Release.Name }}:3100/..., which
        # isn't a real service — the loki subchart's actual service is release-prefixed.
        - url: http://monitoring-loki:3100/loki/api/v1/push
  grafana:
    enabled: false  # use kube-prometheus-stack's Grafana instead
