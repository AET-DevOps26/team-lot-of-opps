global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Services no longer expose their own /metrics — they push OTLP to the
  # OpenTelemetry Collector, which re-exposes everything here for scraping.
  - job_name: 'otel-collector'
    # Collector re-exposes each service's own job/instance labels; keep them
    # instead of overwriting with job="otel-collector".
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
