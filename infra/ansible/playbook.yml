---
- name: Configure Azure VM for lot-of-opps
  hosts: azure_vm
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - ufw
        state: present

    # ── Firewall ────────────────────────────────────────────────────────────
    # Only SSH + Traefik (80/443) are exposed publicly. The k3s API (6443) is
    # reached over an SSH tunnel from CI, never opened to the internet.
    - name: Allow public ports through UFW
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    # Without this, UFW's default-deny drops intra-cluster (flannel) traffic and
    # the single-node cluster's pods can't talk to each other or the API.
    - name: Allow k3s pod and service CIDRs through UFW
      ufw:
        rule: allow
        src: "{{ item }}"
      loop:
        - 10.42.0.0/16
        - 10.43.0.0/16

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    # ── k3s ─────────────────────────────────────────────────────────────────
    # Single-node cluster. Disable the bundled Traefik — our Helm chart ships
    # its own. kubeconfig stays root-owned (600); CI reads it via sudo.
    - name: Install single-node k3s
      shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="--disable traefik --write-kubeconfig-mode 600" sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    # ── On-box tooling (debugging convenience) ──────────────────────────────
    - name: Install Helm
      shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash
        creates: /usr/local/bin/helm

    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Give user a kubeconfig so kubectl/helm work on-box
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
