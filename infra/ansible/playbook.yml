---
- name: Configure Azure VM for lot-of-opps
  hosts: azure_vm
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - ufw
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      notify: Reboot to apply group

    - name: Allow SSH through UFW
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP through UFW
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through UFW
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow backend port through UFW
      ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Allow AI port through UFW
      ufw:
        rule: allow
        port: "8081"
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Add kubectl GPG key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key
        state: present

    - name: Add kubectl apt repository
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /"
        state: present

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: true

    - name: Add Helm GPG key
      apt_key:
        url: https://baltocdn.com/helm/signing.asc
        state: present

    - name: Add Helm apt repository
      apt_repository:
        repo: "deb https://baltocdn.com/helm/stable/debian/ all main"
        state: present

    - name: Install Helm
      apt:
        name: helm
        state: present
        update_cache: true

    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Create app directory
      file:
        path: "/home/{{ ansible_user }}/app"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

  handlers:
    - name: Reboot to apply group
      reboot:
        msg: "Rebooting to apply docker group membership"
        reboot_timeout: 120
