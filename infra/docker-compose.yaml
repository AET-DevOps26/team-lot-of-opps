services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - network
    restart: unless-stopped

  # Firebase Auth Emulator — local, offline stand-in for production Firebase.
  # Needs no real project or service account; sign-ups appear in its UI on :4000.
  firebase-auth:
    build:
      context: ./firebase-emulator
    container_name: firebase-auth
    # --project is tied to FIREBASE_PROJECT_ID so the emulator, auth-service, and
    # client all stamp/expect the same token "aud". Falls back to demo-taxforward.
    command: ["firebase","emulators:start","--only","auth","--project","${FIREBASE_PROJECT_ID:-demo-taxforward}","--config","/firebase.json"]
    ports:
      - "9099:9099"   # Auth emulator (browser reaches it at 127.0.0.1:9099)
      - "4000:4000"   # Emulator UI — http://127.0.0.1:4000/auth
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service
    container_name: auth-service
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-demo-taxforward}
      # Route token verification through the emulator container. Unset (and mount
      # a service account) to verify against production Firebase instead.
      - FIREBASE_AUTH_EMULATOR_HOST=${FIREBASE_AUTH_EMULATOR_HOST:-firebase-auth:9099}
      # Local dev only: skip Firebase verification when no admin credentials exist.
      - DEV_AUTH=${DEV_AUTH:-false}
    networks:
      - network
    depends_on:
      firebase-auth:
        condition: service_healthy
    restart: unless-stopped


  llm-chat:
    platform: linux/amd64
    build:
      context: ../services/llm-chat
      dockerfile: Dockerfile.dev
    container_name: llm-chat
    ports:
      - "8082:8081"
    environment:
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/taxforward
    volumes:
      - ../services/llm-chat/app:/app/app
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.37
    container_name: seaweedfs
    # Credentials in s3.json must match STORAGE_S3_ACCESS_KEY/SECRET_KEY.
    command: server -dir=/data -ip=seaweedfs -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - network
    restart: unless-stopped

  invoice-service:
    platform: linux/amd64
    build:
      context: ../services/invoice-service
      dockerfile: Dockerfile.dev
    container_name: invoice-service
    ports:
      - "8080:8080"
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/taxforward?currentSchema=invoice
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - STORAGE_S3_ENDPOINT=http://seaweedfs:8333
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-invoices}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-devkey}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-devsecret}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - UPLOAD_MAX_SIZE_BYTES=${UPLOAD_MAX_SIZE_BYTES}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHAT_URL=${LLM_CHAT_URL}
      - OPENAPI_SPEC_PATH=/api/openapi.yaml
    volumes:
      - ../services/invoice-service/src:/app/src
      - ../api/openapi.yaml:/api/openapi.yaml:ro
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      llm-chat:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  suggestions-service:
    platform: linux/amd64
    build:
      context: ../services/suggestions-service
      dockerfile: Dockerfile.dev
    container_name: suggestions-service
    ports:
      - "8083:8083"
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/taxforward?currentSchema=suggestions
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - INVOICE_SERVICE_URL=${INVOICE_SERVICE_URL}
      - SUGGESTIONS_INVOICE_LIMIT=${SUGGESTIONS_INVOICE_LIMIT}
      - OPENAPI_SPEC_PATH=/api/openapi.yaml
    volumes:
      - ../services/suggestions-service/src:/app/src
      - ../api/openapi.yaml:/api/openapi.yaml:ro
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg16
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=taxforward
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d taxforward"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    platform: linux/amd64
    build:
      context: ../client
      dockerfile: Dockerfile.dev
    container_name: client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_TARGET=${VITE_API_TARGET}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-demo-key}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-demo-taxforward.firebaseapp.com}
      - VITE_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-demo-taxforward}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-demo-taxforward.appspot.com}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-1:000000000000:web:demo}
      # Route the browser SDK at the emulator container (published on the host).
      - VITE_USE_FIREBASE_EMULATOR=${VITE_USE_FIREBASE_EMULATOR:-true}
      - VITE_FIREBASE_AUTH_EMULATOR_HOST=${VITE_FIREBASE_AUTH_EMULATOR_HOST:-127.0.0.1:9099}
    volumes:
      - ../client:/app
      - /app/node_modules
    networks:
      - network
    depends_on:
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - network
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=logsInExplore
      - GF_LOG_CONSOLECOLORS=true
    networks:
      - network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
  prometheus_data:
  grafana_data:

networks:
  network:
    driver: bridge
