services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - network
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service
    container_name: auth-service
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
    volumes:
      - ../services/auth-service/devops-25c9a-firebase-adminsdk-fbsvc-d15365a6ac.json:/app/firebase-service-account.json:ro
    networks:
      - network
    restart: unless-stopped


  llm-chat:
    platform: linux/amd64
    build:
      context: ../services/llm-chat
      dockerfile: Dockerfile.dev
    container_name: llm-chat
    ports:
      - "8082:8081"
    environment:
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/taxforward
    volumes:
      - ../services/llm-chat/app:/app/app
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  invoice-service:
    platform: linux/amd64
    build:
      context: ../services/invoice-service
      dockerfile: Dockerfile.dev
    container_name: invoice-service
    ports:
      - "8080:8080"
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/taxforward?currentSchema=invoice
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - STORAGE_LOCATION=${STORAGE_LOCATION:-/app/uploads}
      - UPLOAD_MAX_SIZE_BYTES=${UPLOAD_MAX_SIZE_BYTES}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHAT_URL=${LLM_CHAT_URL}
    volumes:
      - ../services/invoice-service/src:/app/src
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      llm-chat:
        condition: service_healthy
    restart: unless-stopped

  suggestions-service:
    platform: linux/amd64
    build:
      context: ../services/suggestions-service
      dockerfile: Dockerfile.dev
    container_name: suggestions-service
    ports:
      - "8083:8083"
    environment:
      # SPRING_DATASOURCE_URL is per-service topology (points at this service's
      # own DB), so it stays a literal rather than a shared ${SPRING_DATASOURCE_URL}.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/taxforward?currentSchema=suggestions
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - INVOICE_SERVICE_URL=${INVOICE_SERVICE_URL}
      - SUGGESTIONS_INVOICE_LIMIT=${SUGGESTIONS_INVOICE_LIMIT}
    volumes:
      - ../services/suggestions-service/src:/app/src
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg16
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=taxforward
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d taxforward"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    platform: linux/amd64
    build:
      context: ../client
      dockerfile: Dockerfile.dev
    container_name: client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_TARGET=${VITE_API_TARGET}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    volumes:
      - ../client:/app
      - /app/node_modules
    networks:
      - network
    depends_on:
      invoice-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  network:
    driver: bridge
