images:
  authService:
    repository: "ghcr.io/aet-devops26/taxforward/auth-service"
    tag: "latest"
    pullPolicy: IfNotPresent
  invoiceService:
    repository: "ghcr.io/aet-devops26/taxforward/invoice-service"
    tag: "latest"
    pullPolicy: IfNotPresent
  llmChat:
    repository: "ghcr.io/aet-devops26/taxforward/llm-chat"
    tag: "latest"
    pullPolicy: IfNotPresent
  client:
    repository: "ghcr.io/aet-devops26/taxforward/client"
    tag: "latest"
    pullPolicy: IfNotPresent
  suggestionsService:
    repository: "ghcr.io/aet-devops26/taxforward/suggestions-service"
    tag: "latest"
    pullPolicy: IfNotPresent
  exportService:
    repository: "ghcr.io/aet-devops26/taxforward/export-service"
    tag: "latest"
    pullPolicy: IfNotPresent

traefik:
  imageTag: "v3.3"
  dashboard: false
  logLevel: INFO
  service:
    type: NodePort
    nodePort: ""

llm:
  url: ""
  model: ""
  apiKey: ""

firebase:
  projectId: ""
  serviceAccountJson: ""

invoice:
  uploadMaxSizeBytes: "10485760"

# ─── OpenTelemetry ───────────────────────────────────────────────────────────
# Services push OTLP (metrics + traces) to the collector, which lives in the
# monitoring release's namespace. Default is the AET observ namespace; the VM
# cluster (namespace taxforward-observ) overrides this in values.local.yaml.
otel:
  collectorEndpoint: "http://otel-collector.team-lot-of-opps-observ.svc.cluster.local:4318"

grafana:
  # Cross-namespace backend for the /grafana Traefik route (observability release's namespace).
  backendUrl: "http://monitoring-grafana.team-lot-of-opps-observ.svc.cluster.local:80"

seaweedfs:
  image: "chrislusf/seaweedfs"
  tag: "4.37"
  bucket: "invoices"
  accessKey: "devkey"
  secretKey: "devsecret"
  region: "us-east-1"
suggestions:
  invoiceLimit: "5"

# ─── Database configuration ─────────────────────────────────────────────────
# Single PostgreSQL instance; logical schemas (invoice, llm_chat, suggestions)
# provide data isolation between services.
db:
  name: taxforward
  user: appuser
  password: ""
  initSql: ""  # injected at deploy time via --set-file db.initSql=infra/postgres/init.sql

# ─── Persistent storage ──────────────────────────────────────────────────────
persistence:
  storageClassName: "csi-rbd-sc"   # cluster default; set explicitly to avoid ambiguity
  db:
    size: "10Gi"
  seaweedfs:
    size: "10Gi"

# ─── TLS / Ingress ───────────────────────────────────────────────────────────
# Cluster uses nginx ingress class + cert-manager with letsencrypt-prod.
# Confirm hostname with tutor before first deploy.
tls:
  host: "taxforward-devops-ss26.stud.k8s.aet.cit.tum.de"
  clusterIssuer: "letsencrypt-prod"

# ─── Resource limits / requests ──────────────────────────────────────────────
# Total limits must stay within the Rancher project quota: 4 vCPU / 6 Gi.
# App totals: CPU 3400m, memory 4864Mi.
# invoiceService/suggestionsService/llmChat limits trimmed to leave RollingUpdate
# surge headroom (deployments use maxSurge:1/maxUnavailable:0, see templates).
resources:
  traefik:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"
  authService:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  invoiceService:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "600m"
      memory: "640Mi"
  # llm-chat loads a sentence-transformers embedding model into memory.
  llmChat:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "700m"
      memory: "1792Mi"
  suggestionsService:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "600m"
      memory: "640Mi"
  # Stateless and idle between exports; the burst is rendering a PDF and buffering
  # one ZIP archive in memory.
  exportService:
    requests:
      cpu: "150m"
      memory: "384Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  client:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"
  db:
    requests:
      cpu: "150m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  seaweedfs:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ─── Replica counts ──────────────────────────────────────────────────────────
replicaCount:
  traefik: 1
  authService: 1
  invoiceService: 1
  llmChat: 1
  suggestionsService: 1
  exportService: 1
  client: 1
