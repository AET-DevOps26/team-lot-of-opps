apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taxforward.fullname" . }}-export-service
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    app.kubernetes.io/name: export-service
spec:
  replicas: {{ .Values.replicaCount.exportService }}
  selector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Roll in place: no surge pod, to stay within the 4-vCPU namespace quota.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "taxforward.labels" . | nindent 8 }}
        app.kubernetes.io/name: export-service
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.images.exportService.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: export-service
          image: "{{ .Values.images.exportService.repository }}:{{ .Values.images.exportService.tag }}"
          imagePullPolicy: {{ .Values.images.exportService.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "taxforward.fullname" . }}-config
          # The service is stateless — no datasource, no secrets. Its only
          # dependency is invoice-service's gRPC port, addressed on the cluster network.
          env:
            - name: INVOICE_SERVICE_GRPC_URL
              value: "{{ include "taxforward.fullname" . }}-invoice-service:9090"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.exportService | nindent 12 }}
