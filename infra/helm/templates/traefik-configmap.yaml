apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taxforward.fullname" . }}-traefik-config
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    app.kubernetes.io/name: traefik
data:
  traefik.yml: |
    entryPoints:
      web:
        address: ":80"

    ping:
      entryPoint: web

    providers:
      file:
        filename: /etc/traefik/dynamic.yml
        watch: true

    {{- if .Values.traefik.dashboard }}
    api:
      dashboard: true
      insecure: true
    {{- end }}

    log:
      level: {{ .Values.traefik.logLevel }}

  dynamic.yml: |
    http:
      middlewares:
        firebase-auth:
          forwardAuth:
            address: "http://{{ include "taxforward.fullname" . }}-auth-service:8000/verify"
            authResponseHeaders:
              - "X-User-Sub"

      routers:
        invoice-router:
          rule: "PathPrefix(`/api/v1/documents`) || PathPrefix(`/api/v1/invoices`)"
          entryPoints:
            - web
          middlewares:
            - firebase-auth
          service: invoice-svc

        llm-chat-router:
          rule: "PathPrefix(`/api/v1/agent`)"
          entryPoints:
            - web
          middlewares:
            - firebase-auth
          service: llm-chat-svc

        suggestions-router:
          rule: "PathPrefix(`/api/v1/suggestions`)"
          entryPoints:
            - web
          middlewares:
            - firebase-auth
          service: suggestions-svc

        export-router:
          rule: "PathPrefix(`/api/v1/exports`)"
          entryPoints:
            - web
          middlewares:
            - firebase-auth
          service: export-svc

        # Catch-all: serves the SPA. Default rule-length priority keeps the
        # /api/* routers winning over this one. No auth middleware — the
        # client is public; auth happens client-side via Firebase.
        client-router:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - web
          service: client-svc

        # Grafana keeps the /grafana prefix in the forwarded path (no StripPrefix) —
        # Grafana itself is configured to serve from that sub-path, see infra/monitoring/values.yaml.
        grafana-router:
          rule: "PathPrefix(`/grafana`)"
          entryPoints:
            - web
          service: grafana-svc

      services:
        invoice-svc:
          loadBalancer:
            servers:
              - url: "http://{{ include "taxforward.fullname" . }}-invoice-service:8080"

        llm-chat-svc:
          loadBalancer:
            servers:
              - url: "http://{{ include "taxforward.fullname" . }}-llm-chat:8081"

        suggestions-svc:
          loadBalancer:
            servers:
              - url: "http://{{ include "taxforward.fullname" . }}-suggestions-service:8083"

        export-svc:
          loadBalancer:
            servers:
              - url: "http://{{ include "taxforward.fullname" . }}-export-service:8084"

        client-svc:
          loadBalancer:
            servers:
              - url: "http://{{ include "taxforward.fullname" . }}-client:80"

        grafana-svc:
          loadBalancer:
            servers:
              # Grafana lives in the observability release's namespace, not this one — cross-namespace
              # ClusterIP DNS. That namespace differs per target (AET vs VM), so it's a value.
              - url: {{ .Values.grafana.backendUrl | quote }}
