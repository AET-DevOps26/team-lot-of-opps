{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "taxforward.fullname" . }}-alerts
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    monitoring: "true"
spec:
  groups:
    - name: taxforward
      rules:
        - alert: HighErrorRate
          expr: |
            sum by (job) (rate(http_server_requests_milliseconds_count{status=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_requests_milliseconds_count[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ "{{" }} $labels.job {{ "}}" }}"

        - alert: PodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 5
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} restarting repeatedly"

        - alert: SlowP99Response
          expr: histogram_quantile(0.99, sum by (job, le) (rate(http_server_requests_milliseconds_bucket[5m]))) > 2000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency > 2s on {{ "{{" }} $labels.job {{ "}}" }}"

        # FastAPI services (auth-service, llm-chat) emit OTel's stable HTTP histogram
        # http_server_request_duration_seconds_* (status label http_response_status_code)
        # instead of Spring's http_server_requests_milliseconds_* — sibling rules cover them.
        - alert: HighErrorRate
          expr: |
            sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ "{{" }} $labels.job {{ "}}" }}"

        - alert: SlowP99Response
          expr: histogram_quantile(0.99, sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency > 2s on {{ "{{" }} $labels.job {{ "}}" }}"
{{- end }}
