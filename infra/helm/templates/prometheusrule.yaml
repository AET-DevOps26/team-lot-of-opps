{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "taxforward.fullname" . }}-alerts
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
    monitoring: "true"
spec:
  groups:
    - name: taxforward
      rules:
        - alert: HighErrorRate
          expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ "{{" }} $labels.job {{ "}}" }}"

        - alert: PodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 5
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} restarting repeatedly"

        - alert: SlowP99Response
          expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency > 2s on {{ "{{" }} $labels.job {{ "}}" }}"
{{- end }}
