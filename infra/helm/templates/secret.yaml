apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taxforward.fullname" . }}-secret
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
type: Opaque
data:
  dbPassword: {{ .Values.db.password | b64enc | quote }}
  llmApiKey: {{ .Values.llm.apiKey | b64enc | quote }}
  seaweedfsSecretKey: {{ .Values.seaweedfs.secretKey | b64enc | quote }}
  seaweedfs-s3.json: {{ printf `{"identities":[{"name":"invoice-service","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}` .Values.seaweedfs.accessKey .Values.seaweedfs.secretKey | b64enc | quote }}
{{- if .Values.firebase.serviceAccountJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taxforward.fullname" . }}-firebase-sa
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
type: Opaque
data:
  firebase-service-account.json: {{ .Values.firebase.serviceAccountJson | b64enc | quote }}
{{- end }}
