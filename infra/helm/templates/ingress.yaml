{{- if .Values.tls.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taxforward.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taxforward.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.tls.host }}
      secretName: {{ include "taxforward.fullname" . }}-tls
  rules:
    - host: {{ .Values.tls.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "taxforward.fullname" . }}-traefik
                port:
                  number: 80
{{- end }}
