name: Suggestions-service Test

on:
  pull_request:
    paths:
      - 'services/suggestions-service/**'
      - 'api/**'
      - '.github/workflows/suggestions-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/suggestions-service/**'
      - 'api/**'
      - '.github/workflows/suggestions-service.yml'

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/suggestions-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew test

