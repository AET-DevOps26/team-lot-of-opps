name: Invoice-service Test

on:
  pull_request:
    paths:
      - 'services/invoice-service/**'
      - 'api/**'
      - '.github/workflows/invoice-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/invoice-service/**'
      - 'api/**'
      - '.github/workflows/invoice-service.yml'

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/invoice-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run checks (tests + spotless)
        run: ./gradlew check

