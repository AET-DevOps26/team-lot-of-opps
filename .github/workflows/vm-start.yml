name: Start Azure VM

# Boots a VM previously stopped by vm-stop.yml. 
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision
  cancel-in-progress: false

jobs:
  start:
    name: Start VM
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Start
        run: az vm start --resource-group lot-of-opps-rg --name lot-of-opps-vm
