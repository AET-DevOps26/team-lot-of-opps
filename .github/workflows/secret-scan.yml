name: Secret Scan

# Authoritative secret-scanning gate. The local pre-commit hook (gitleaks) is a
# convenience and can be bypassed with `git commit --no-verify`, so CI runs the
# same scanner — pinned to the same version (keep the image tag in sync with the
# gitleaks `rev` in .pre-commit-config.yaml). Runs on every PR and push to main
# (no path filter — a secret can land in any file). Scans the checked-out tree
# (`gitleaks dir`), so it is independent of git history.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config .gitleaks.toml --redact --verbose --exit-code 1
