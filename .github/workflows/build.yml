name: Build images

# Reusable: build + push the 5 service images to GHCR and report the tag.
# Called by deploy.yml; also runnable on its own for PR build smoke-checks.
on:
  workflow_call:
    outputs:
      image_tag:
        description: Tag the images were pushed under (sha-<short>)
        value: ${{ jobs.tag.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  ORG: aet-devops26/taxforward

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=sha-$(echo ${{ github.sha }} | head -c 7)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: client
            context: ./client
            dockerfile: ./client/Dockerfile
          - service: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - service: invoice-service
            context: ./services/invoice-service
            dockerfile: ./services/invoice-service/Dockerfile
            build_contexts: api=api
          - service: llm-chat
            context: ./services/llm-chat
            dockerfile: ./services/llm-chat/Dockerfile
          - service: suggestions-service
            context: ./services/suggestions-service
            dockerfile: ./services/suggestions-service/Dockerfile
            build_contexts: api=api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # Vite bakes env vars into the bundle at build time, so the client
      # image needs the Firebase config as build args.
      - name: Set client build args
        id: build_args
        run: |
          if [ "${{ matrix.service }}" = "client" ]; then
            {
              echo 'args<<EOF'
              echo 'VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}'
              echo 'VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}'
              echo 'VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}'
              echo 'VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}'
              echo 'VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}'
              echo 'VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'args=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.build_args.outputs.args }}
