name: LLM-chat Test

on:
  pull_request:
    paths:
      - 'services/llm-chat/**'
      - '.github/workflows/llm-chat.yml'
  push:
    branches: [main]
    paths:
      - 'services/llm-chat/**'
      - '.github/workflows/llm-chat.yml'

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm-chat
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Test
        run: pytest tests/ -m "not integration"
        
  lint-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm-chat
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tox
        run: tox -e lint,type

