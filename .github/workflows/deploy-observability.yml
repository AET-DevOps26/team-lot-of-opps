name: Deploy Observability Stack

# The ONLY place the monitoring chart (Prometheus + Grafana + Loki) is deployed.
# Pushes that touch infra/monitoring auto-deploy to the AET cluster; use the
# manual trigger to (re)deploy to either cluster.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cluster to deploy monitoring to
        type: choice
        options: [aet, vm]
        default: aet
  # Called by deploy-all.yml. workflow_call inputs can't be type: choice.
  workflow_call:
    inputs:
      target:
        type: string
        required: false
        default: aet
  push:
    branches: [main]
    paths:
      - infra/monitoring/**
      - .github/workflows/deploy-observability.yml

env:
  # Deterministic Azure DNS name (Terraform domain_name_label = vm_name).
  VM_HOST: ${{ vars.VM_HOST }}

jobs:
  deploy:
    name: Helm deploy monitoring stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # Single place mapping target -> per-target config. k3s on the VM has no
      # Ceph (csi-rbd-sc) storage class; fall back to local-path.
      - name: Resolve target config
        id: vars
        run: |
          TARGET="${{ github.event_name == 'push' && 'aet' || inputs.target }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          # Namespace differs by target: VM stays 'taxforward-observ' (single-tenant k3s);
          # AET uses a team-prefixed namespace in the shared Rancher project.
          if [ "$TARGET" = "vm" ]; then
            echo "storage_class=local-path" >> "$GITHUB_OUTPUT"
            echo "OBS_NAMESPACE=taxforward-observ" >> "$GITHUB_ENV"
          else
            echo "storage_class=csi-rbd-sc" >> "$GITHUB_OUTPUT"
            echo "OBS_NAMESPACE=team-lot-of-opps-observ" >> "$GITHUB_ENV"
          fi

      - name: Resolve kube context
        uses: ./.github/actions/kube-context
        with:
          target: ${{ steps.vars.outputs.target }}
          vm_host: ${{ env.VM_HOST }}
          kube_config: ${{ secrets.KUBE_CONFIG }}
          ssh_private_key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      # AET is Rancher: pre-create the namespace annotated into the team's project
      # so it isn't an orphaned "not in a project" namespace (see deploy.yml).
      # Idempotent; VM (plain k3s) uses helm --create-namespace instead.
      - name: Ensure namespace in the AET Rancher project
        if: steps.vars.outputs.target == 'aet'
        run: |
          PROJECT_ID='${{ vars.AET_PROJECT_ID }}'
          [ -n "$PROJECT_ID" ] || { echo "::error::repo variable AET_PROJECT_ID is not set"; exit 1; }
          kubectl get namespace "$OBS_NAMESPACE" >/dev/null 2>&1 || kubectl create -f - <<YAML
          apiVersion: v1
          kind: Namespace
          metadata:
            name: $OBS_NAMESPACE
            annotations:
              field.cattle.io/projectId: "$PROJECT_ID"
            labels:
              field.cattle.io/projectId: "${PROJECT_ID#*:}"
          YAML

      # Alertmanager reads the bot token from a file, so it has to exist as a Secret
      # in the Alertmanager namespace before the chart mounts it. Passing it via
      # --set instead would persist it into the Helm release values.
      - name: Ensure Telegram bot token secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "::error::repo secret TELEGRAM_BOT_TOKEN is not set"; exit 1; }
          kubectl create namespace "$OBS_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic telegram-bot-token \
            --namespace "$OBS_NAMESPACE" \
            --from-literal=token="$TELEGRAM_BOT_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy monitoring stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency update infra/monitoring
          # CRDs are cluster-scoped. On the VM this is the only place the Prometheus operator
          # + its CRDs get installed (Ansible stops at k3s), and the deploy runs as k3s
          # cluster-admin, so let Helm install the chart's bundled monitoring.coreos.com CRDs.
          # On aet the student account can't create cluster-scoped CRDs, so skip them and rely
          # on the ones the chair pre-installs on the cluster.
          SKIP_CRDS=""
          [ "${{ steps.vars.outputs.target }}" = "aet" ] && SKIP_CRDS="--skip-crds"
          helm upgrade --install monitoring infra/monitoring \
            --namespace "$OBS_NAMESPACE" --create-namespace \
            $SKIP_CRDS \
            --atomic --timeout 10m \
            --set "kube-prometheus-stack.grafana.persistence.storageClassName=${{ steps.vars.outputs.storage_class }}" \
            --set "kube-prometheus-stack.grafana.adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set "kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=${{ steps.vars.outputs.storage_class }}" \
            --set "loki.storageClassName=${{ steps.vars.outputs.storage_class }}"
