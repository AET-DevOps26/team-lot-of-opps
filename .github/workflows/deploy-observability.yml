name: Deploy Observability Stack

# The ONLY place the monitoring chart (Prometheus + Grafana + Loki) is deployed.
# Pushes that touch infra/monitoring auto-deploy to the AET cluster; use the
# manual trigger to (re)deploy to the VM's k3s.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cluster to deploy monitoring to
        type: choice
        options: [aet, vm]
        default: aet
  push:
    branches: [main]
    paths:
      - infra/monitoring/**
      - .github/workflows/deploy-observability.yml

env:
  # Deterministic Azure DNS name (Terraform domain_name_label = vm_name).
  VM_HOST: ${{ vars.VM_HOST }}

jobs:
  deploy:
    name: Helm deploy monitoring stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # Single place mapping target -> per-target config. k3s on the VM has no
      # Ceph (csi-rbd-sc) storage class; fall back to local-path.
      - name: Resolve target config
        id: vars
        run: |
          TARGET="${{ github.event_name == 'push' && 'aet' || inputs.target }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "vm" ]; then
            echo "storage_class=local-path" >> "$GITHUB_OUTPUT"
          else
            echo "storage_class=csi-rbd-sc" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve kube context
        uses: ./.github/actions/kube-context
        with:
          target: ${{ steps.vars.outputs.target }}
          vm_host: ${{ env.VM_HOST }}
          kube_config: ${{ secrets.KUBE_CONFIG }}
          ssh_private_key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Deploy monitoring stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency update infra/monitoring
          # CRDs are cluster-scoped; the student account can't create them, so
          # rely on the ones already installed on the AET cluster.
          helm upgrade --install monitoring infra/monitoring \
            --namespace taxforward-observ --create-namespace \
            --skip-crds \
            --atomic --timeout 10m \
            --set "kube-prometheus-stack.grafana.persistence.storageClassName=${{ steps.vars.outputs.storage_class }}" \
            --set "kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=${{ steps.vars.outputs.storage_class }}" \
            --set "loki-stack.loki.persistence.storageClassName=${{ steps.vars.outputs.storage_class }}"
