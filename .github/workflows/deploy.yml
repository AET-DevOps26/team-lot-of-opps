name: Deploy

# One app deploy for both targets (both run k3s/Helm):
#   push to main          -> auto-deploy to BOTH the AET cluster and the VM
#   workflow_dispatch     -> choose target: aet (AET cluster) or vm
# Monitoring is NOT deployed here — see deploy-observability.yml.
# Push-to-main does NOT provision the VM (see vm-provision.yml) — it must
# already be up (vm-start.yml) or the vm leg of the matrix will fail to connect.
#
# Rolling back: for the fast path use rollback.yml (helm rollback, no build). To
# redeploy a known-good commit instead, dispatch this with ref + image_tag both
# set to that commit. See docs/runbook-rollback.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Cluster to deploy to
        type: choice
        options: [aet, vm]
        default: aet
      image_tag:
        description: Deploy an already-built tag (e.g. sha-abc1234). Leave empty to build from this commit.
        type: string
        required: false
      ref:
        description: Take the chart from this commit/tag instead of the current one. Requires image_tag.
        type: string
        required: false
  # Called by deploy-all.yml (the one-click app + observability dispatcher).
  # workflow_call inputs can't be type: choice, so target is a string here.
  workflow_call:
    inputs:
      target:
        type: string
        required: false
        default: aet
      image_tag:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  # provision.yml (called for vm deploys) exchanges the OIDC token with Azure;
  # a called workflow can't be granted more than the caller, so grant it here.
  id-token: write

# Two pushes to main in quick succession must not run helm upgrade concurrently
# against the same cluster; later run supersedes the queued one.
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  # Deterministic Azure DNS name (Terraform domain_name_label = vm_name); stable
  # across IP recreates, so no AZURE_VM_IP variable to maintain.
  VM_HOST: ${{ vars.VM_HOST }}
  # Helm release name → resource names (taxforward-tax-forward-*). Same on both
  # clusters. The namespace differs by target and is set in the "vars" step.
  RELEASE: taxforward

jobs:
  # A VM deploy always provisions first (Terraform + Ansible) — it's idempotent,
  # so it's a no-op when the VM already matches. Never runs for aet.
  provision:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'vm' }}
    uses: ./.github/workflows/vm-provision.yml
    secrets: inherit

  build:
    # Skip building only when a manual run pins an existing tag.
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: [build, provision]
    if: ${{ always()
         && (needs.build.result == 'success' || needs.build.result == 'skipped')
         && (needs.provision.result == 'success' || needs.provision.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Push to main fans out to both clusters; a manual dispatch/call still
      # targets just the one target it asked for.
      matrix:
        target: ${{ github.event_name == 'push' && fromJSON('["aet","vm"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    steps:
      # Empty ref = the triggering commit, i.e. the normal push-to-main path.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # Single place mapping target -> per-target config. The VM's single-node
      # k3s has no Ceph storage class and no external LB; use built-in
      # local-path PVs and klipper-lb to bind host :80.
      - name: Resolve target config and image tag
        id: vars
        run: |
          # 'ref' only pins the chart. Without image_tag the build job would still
          # build from the dispatch branch, silently pairing an old chart with new
          # images — the exact split a rollback is supposed to close.
          if [ -n "${{ inputs.ref }}" ] && [ -z "${{ inputs.image_tag }}" ]; then
            echo "::error::'ref' pins the chart but not the images — pass image_tag (e.g. sha-abc1234) from the same commit"
            exit 1
          fi

          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            vm)
              echo "storage_class=local-path"
              echo "traefik_service_type=LoadBalancer"
              ;;
            aet)
              echo "storage_class=csi-rbd-sc"
              echo "traefik_service_type=NodePort"
              ;;
          esac >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          # Namespace differs by target: the VM stays 'taxforward' (single-tenant k3s);
          # AET uses a team-prefixed namespace in the shared Rancher project.
          [ "$TARGET" = "aet" ] && echo "APP_NAMESPACE=team-lot-of-opps" >> "$GITHUB_ENV" \
                               || echo "APP_NAMESPACE=taxforward" >> "$GITHUB_ENV"
          # The observability release lives in its own namespace, which differs per
          # target (see deploy-observability.yml). The /grafana Traefik backend and the
          # OTLP collector endpoint both resolve into it, so they track the target too.
          [ "$TARGET" = "aet" ] && echo "OBS_NAMESPACE=team-lot-of-opps-observ" >> "$GITHUB_ENV" \
                               || echo "OBS_NAMESPACE=taxforward-observ" >> "$GITHUB_ENV"
          TAG="${{ inputs.image_tag }}"
          [ -n "$TAG" ] || TAG="${{ needs.build.outputs.image_tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve kube context
        uses: ./.github/actions/kube-context
        with:
          target: ${{ steps.vars.outputs.target }}
          vm_host: ${{ env.VM_HOST }}
          kube_config: ${{ secrets.KUBE_CONFIG }}
          ssh_private_key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Write Firebase service account file
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > firebase-sa.json

      # AET is Rancher: a bare `helm --create-namespace` namespace lands "not in a
      # project" — no team RBAC, and we can't delete it. Pre-create it annotated
      # into the team-lot-of-opps project so it inherits the team's access.
      # Idempotent: skip if it already exists. VM (plain k3s) uses --create-namespace.
      - name: Ensure namespace in the AET Rancher project
        if: steps.vars.outputs.target == 'aet'
        run: |
          PROJECT_ID='${{ vars.AET_PROJECT_ID }}'
          [ -n "$PROJECT_ID" ] || { echo "::error::repo variable AET_PROJECT_ID is not set"; exit 1; }
          kubectl get namespace "$APP_NAMESPACE" >/dev/null 2>&1 || kubectl create -f - <<YAML
          apiVersion: v1
          kind: Namespace
          metadata:
            name: $APP_NAMESPACE
            annotations:
              field.cattle.io/projectId: "$PROJECT_ID"
            labels:
              field.cattle.io/projectId: "${PROJECT_ID#*:}"
          YAML

      - name: Helm upgrade --install
        run: |
          REGISTRY=ghcr.io/aet-devops26/taxforward
          TAG="${{ steps.vars.outputs.tag }}"

          helm upgrade --install "$RELEASE" ./infra/helm \
            --namespace "$APP_NAMESPACE" --create-namespace \
            --atomic \
            --timeout 10m \
            -f infra/helm/values.yaml \
            --set llm.url="${{ vars.LLM_URL }}" \
            --set llm.model="${{ vars.LLM_MODEL }}" \
            --set llm.apiKey="${{ secrets.LLM_API_KEY }}" \
            --set firebase.projectId="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --set db.password="${{ secrets.DB_PASSWORD }}" \
            --set images.authService.repository="${REGISTRY}/auth-service" \
            --set images.authService.tag="${TAG}" \
            --set images.invoiceService.repository="${REGISTRY}/invoice-service" \
            --set images.invoiceService.tag="${TAG}" \
            --set images.llmChat.repository="${REGISTRY}/llm-chat" \
            --set images.llmChat.tag="${TAG}" \
            --set images.client.repository="${REGISTRY}/client" \
            --set images.client.tag="${TAG}" \
            --set images.suggestionsService.repository="${REGISTRY}/suggestions-service" \
            --set images.suggestionsService.tag="${TAG}" \
            --set-file firebase.serviceAccountJson=firebase-sa.json \
            --set-file db.initSql=infra/postgres/init.sql \
            --set persistence.storageClassName="${{ steps.vars.outputs.storage_class }}" \
            --set traefik.service.type="${{ steps.vars.outputs.traefik_service_type }}" \
            --set grafana.backendUrl="http://monitoring-grafana.${OBS_NAMESPACE}.svc.cluster.local:80" \
            --set otel.collectorEndpoint="http://otel-collector.${OBS_NAMESPACE}.svc.cluster.local:4318"

      # --atomic only proves the pods went ready. A service that answers /health but
      # 500s on every real request is a successful deploy as far as Helm is concerned.
      - name: Smoke test
        id: smoke
        uses: ./.github/actions/smoke-test
        with:
          namespace: ${{ env.APP_NAMESPACE }}
          release: ${{ env.RELEASE }}

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "===== PVC ====="; kubectl get pvc -n "$APP_NAMESPACE" -o wide || true
          kubectl describe pvc -n "$APP_NAMESPACE" || true
          echo "===== PODS ====="; kubectl get pods -n "$APP_NAMESPACE" -o wide || true
          kubectl describe pods -n "$APP_NAMESPACE" || true
          echo "===== EVENTS ====="; kubectl get events -n "$APP_NAMESPACE" --sort-by=.lastTimestamp || true
          echo "===== HELM ====="; helm status "$RELEASE" -n "$APP_NAMESPACE" || true

      # If the upgrade itself failed, --atomic already rolled it back. It cannot help
      # here: Helm called the release healthy and only the smoke test disagreed.
      - name: Roll back after failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          REVS=$(helm history "$RELEASE" --namespace "$APP_NAMESPACE" -o json | jq 'length')
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::first revision of $RELEASE — nothing to roll back to, leaving it up for inspection"
            exit 0
          fi
          helm rollback "$RELEASE" --namespace "$APP_NAMESPACE" --wait --timeout 5m
          echo "::warning::Smoke test failed; rolled $RELEASE back to the previous revision. main still carries this commit — revert it."

      - name: Print application URL
        run: |
          if [ "${{ steps.vars.outputs.target }}" = "vm" ]; then
            echo "App reachable at: http://${VM_HOST}/"
          else
            NODE_PORT=$(kubectl get svc "$RELEASE-tax-forward-traefik" \
              --namespace "$APP_NAMESPACE" \
              -o jsonpath='{.spec.ports[0].nodePort}')
            NODE_IP=$(kubectl get nodes \
              -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
            echo "App reachable at: http://${NODE_IP}:${NODE_PORT}"
          fi

      - name: Clean up Firebase service account
        if: always()
        run: rm -f firebase-sa.json
