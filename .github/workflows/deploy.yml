name: Deploy

# One app deploy for both targets (both run k3s/Helm):
#   push to main          -> auto-deploy to the Azure VM (k3s)
#   workflow_dispatch     -> choose target: aet (AET cluster) or vm
# Monitoring is NOT deployed here — see deploy-observability.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Cluster to deploy to
        type: choice
        options: [aet, vm]
        default: aet
      image_tag:
        description: Deploy an already-built tag (e.g. sha-abc1234). Leave empty to build from this commit.
        type: string
        required: false

permissions:
  contents: read
  packages: write

# Two pushes to main in quick succession must not run helm upgrade concurrently
# against the same cluster; later run supersedes the queued one.
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  # Deterministic Azure DNS name (Terraform domain_name_label = vm_name); stable
  # across IP recreates, so no AZURE_VM_IP variable to maintain.
  VM_HOST: ${{ vars.VM_HOST }}

jobs:
  build:
    # Skip building only when a manual run pins an existing tag.
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # Single place mapping target -> per-target config. The VM's single-node
      # k3s has no Ceph storage class and no external LB; use built-in
      # local-path PVs and klipper-lb to bind host :80.
      - name: Resolve target config and image tag
        id: vars
        run: |
          TARGET="${{ github.event_name == 'push' && 'vm' || inputs.target }}"
          case "$TARGET" in
            vm)
              echo "storage_class=local-path"
              echo "traefik_service_type=LoadBalancer"
              ;;
            aet)
              echo "storage_class=csi-rbd-sc"
              echo "traefik_service_type=NodePort"
              ;;
          esac >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.image_tag }}"
          [ -n "$TAG" ] || TAG="${{ needs.build.outputs.image_tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve kube context
        uses: ./.github/actions/kube-context
        with:
          target: ${{ steps.vars.outputs.target }}
          vm_host: ${{ env.VM_HOST }}
          kube_config: ${{ secrets.KUBE_CONFIG }}
          ssh_private_key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Write Firebase service account file
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > firebase-sa.json

      - name: Helm upgrade --install
        run: |
          REGISTRY=ghcr.io/aet-devops26/taxforward
          TAG="${{ steps.vars.outputs.tag }}"

          helm upgrade --install taxforward ./infra/helm \
            --namespace taxforward --create-namespace \
            --atomic \
            --timeout 10m \
            -f infra/helm/values.yaml \
            --set llm.url="${{ vars.LLM_URL }}" \
            --set llm.model="${{ vars.LLM_MODEL }}" \
            --set llm.apiKey="${{ secrets.LLM_API_KEY }}" \
            --set firebase.projectId="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --set db.password="${{ secrets.DB_PASSWORD }}" \
            --set images.authService.repository="${REGISTRY}/auth-service" \
            --set images.authService.tag="${TAG}" \
            --set images.invoiceService.repository="${REGISTRY}/invoice-service" \
            --set images.invoiceService.tag="${TAG}" \
            --set images.llmChat.repository="${REGISTRY}/llm-chat" \
            --set images.llmChat.tag="${TAG}" \
            --set images.client.repository="${REGISTRY}/client" \
            --set images.client.tag="${TAG}" \
            --set images.suggestionsService.repository="${REGISTRY}/suggestions-service" \
            --set images.suggestionsService.tag="${TAG}" \
            --set-file firebase.serviceAccountJson=firebase-sa.json \
            --set-file db.initSql=infra/postgres/init.sql \
            --set persistence.storageClassName="${{ steps.vars.outputs.storage_class }}" \
            --set traefik.service.type="${{ steps.vars.outputs.traefik_service_type }}"

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "===== PVC ====="; kubectl get pvc -n taxforward -o wide || true
          kubectl describe pvc -n taxforward || true
          echo "===== PODS ====="; kubectl get pods -n taxforward -o wide || true
          kubectl describe pods -n taxforward || true
          echo "===== EVENTS ====="; kubectl get events -n taxforward --sort-by=.lastTimestamp || true
          echo "===== HELM ====="; helm status taxforward -n taxforward || true

      # --atomic only proves pods became ready; this proves Traefik actually
      # routes traffic end-to-end on the VM (aet has no stable public URL here).
      - name: Smoke test
        if: steps.vars.outputs.target == 'vm'
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "http://${VM_HOST}/" && echo "smoke test passed"

      - name: Print application URL
        run: |
          if [ "${{ steps.vars.outputs.target }}" = "vm" ]; then
            echo "App reachable at: http://${VM_HOST}/"
          else
            NODE_PORT=$(kubectl get svc taxforward-tax-forward-traefik \
              --namespace taxforward \
              -o jsonpath='{.spec.ports[0].nodePort}')
            NODE_IP=$(kubectl get nodes \
              -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
            echo "App reachable at: http://${NODE_IP}:${NODE_PORT}"
          fi

      - name: Clean up Firebase service account
        if: always()
        run: rm -f firebase-sa.json
