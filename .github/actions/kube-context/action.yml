name: Resolve kube context
description: Point KUBECONFIG at the chosen cluster (aet | vm) for helm/kubectl steps.

inputs:
  target:
    description: aet (AET cluster via KUBE_CONFIG) or vm (Azure VM k3s via SSH tunnel)
    required: true
  vm_host:
    description: Stable DNS name of the Azure VM (required when target=vm)
    required: false
  kube_config:
    description: base64-encoded kubeconfig for the AET cluster (required when target=aet)
    required: false
  ssh_private_key:
    description: SSH private key for the Azure VM (required when target=vm)
    required: false
  ssh_user:
    description: SSH username for the Azure VM (defaults to azureuser, matching Terraform's admin_username default)
    required: false
    default: azureuser

runs:
  using: composite
  steps:
    - name: Resolve kubeconfig
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VM_HOST: ${{ inputs.vm_host }}
        KUBE_CONFIG: ${{ inputs.kube_config }}
        SSH_KEY: ${{ inputs.ssh_private_key }}
        SSH_USER: ${{ inputs.ssh_user }}
      run: |
        set -euo pipefail
        KCFG="$RUNNER_TEMP/kubeconfig"

        case "$TARGET" in
          aet)
            [ -n "$KUBE_CONFIG" ] || { echo "::error::kube_config required for target=aet"; exit 1; }
            echo "$KUBE_CONFIG" | base64 -d > "$KCFG"
            ;;
          vm)
            [ -n "$VM_HOST" ] || { echo "::error::vm_host required for target=vm (the VM_HOST env in the calling workflow)"; exit 1; }
            [ -n "$SSH_KEY" ] || { echo "::error::ssh_private_key required for target=vm"; exit 1; }
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            # Host keys are pinned in the committed infra/known_hosts (refreshed by
            # the provision workflow); strict checking blocks MITM on a hijacked DNS name.
            SSH_OPTS="-i $HOME/.ssh/id_rsa -o UserKnownHostsFile=$GITHUB_WORKSPACE/infra/known_hosts -o StrictHostKeyChecking=yes"
            # k3s writes its kubeconfig root-owned (mode 600); read it via passwordless sudo.
            # Its server is already https://127.0.0.1:6443, so we tunnel that port locally
            # instead of exposing the k3s API (6443) to the internet.
            ssh $SSH_OPTS "$SSH_USER@$VM_HOST" "sudo cat /etc/rancher/k3s/k3s.yaml" > "$KCFG"
            ssh $SSH_OPTS -o ExitOnForwardFailure=yes -fNL 6443:127.0.0.1:6443 "$SSH_USER@$VM_HOST"
            ;;
          *)
            echo "::error::unknown target '$TARGET' (expected aet or vm)"; exit 1
            ;;
        esac

        chmod 600 "$KCFG"
        echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"
