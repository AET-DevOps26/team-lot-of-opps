version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/auth-service
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/llm-chat
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /services/invoice-service
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /services/suggestions-service
    schedule:
      interval: weekly
