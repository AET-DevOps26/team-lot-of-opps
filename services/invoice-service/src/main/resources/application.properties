spring.application.name=invoice-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxforward?currentSchema=invoice}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=invoice

spring.flyway.schemas=invoice
spring.flyway.default-schema=invoice
# Existing environments already have this table set from the pre-Flyway ddl-auto=update
# era; treat V1 as their current state instead of trying to (re-)create it.
spring.flyway.baseline-on-migrate=true

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:8333}
storage.s3.bucket=${STORAGE_S3_BUCKET:invoices}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:devkey}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:devsecret}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:10485760}

llm.url=${LLM_URL:http://localhost:1234}
llm.model=${LLM_MODEL:google/gemma-4-e2b}
llm.api-key=${LLM_API_KEY:EMPTY}
llm.chat.url=${LLM_CHAT_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
