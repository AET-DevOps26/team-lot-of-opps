spring.application.name=export-service
server.port=8084

invoice.service.url=${INVOICE_SERVICE_URL:http://localhost:8080}

# Arbeitnehmer-Pauschbetrag (§9a EStG): the Werbungskosten every employee may deduct
# without producing a single receipt. Only the amount *above* it is what collecting
# receipts actually buys, so the export reports both figures.
#
# The allowance is set by legislation and changes between tax years. Verify these
# values against the current law before relying on an export; a new tax year needs a
# new line here (and a redeploy).
export.pauschbetrag.default-amount=1230
export.pauschbetrag.by-year[2021]=1000
export.pauschbetrag.by-year[2022]=1200
export.pauschbetrag.by-year[2023]=1230
export.pauschbetrag.by-year[2024]=1230
export.pauschbetrag.by-year[2025]=1230
export.pauschbetrag.by-year[2026]=1230

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
