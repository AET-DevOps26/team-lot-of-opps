spring.application.name=suggestions-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxforward?currentSchema=suggestions}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=suggestions

llm.url=${LLM_URL:http://localhost:1234}
llm.model=${LLM_MODEL:google/gemma-4-e2b}
llm.api-key=${LLM_API_KEY:EMPTY}
invoice.service.url=${INVOICE_SERVICE_URL:http://localhost:8080}
suggestions.invoice-limit=${SUGGESTIONS_INVOICE_LIMIT:5}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
