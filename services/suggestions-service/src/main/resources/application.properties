spring.application.name=suggestions-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxforward?currentSchema=suggestions}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=suggestions

spring.flyway.schemas=suggestions
spring.flyway.default-schema=suggestions
# Existing environments already have this table set from the pre-Flyway ddl-auto=update
# era; treat V1 as their current state instead of trying to (re-)create it.
spring.flyway.baseline-on-migrate=true

llm.url=${LLM_URL:http://localhost:1234}
llm.model=${LLM_MODEL:google/gemma-4-e2b}
llm.api-key=${LLM_API_KEY:EMPTY}
# gRPC client of invoice-service's InternalInvoiceService.
spring.grpc.client.channel.invoice.target=static://${INVOICE_SERVICE_GRPC_URL:localhost:9090}
suggestions.invoice-limit=${SUGGESTIONS_INVOICE_LIMIT:5}

# Metrics + traces + logs are pushed over OTLP to the OpenTelemetry Collector; Actuator
# now only serves health/info probes (OTEL_EXPORTER_OTLP_ENDPOINT set in compose/helm).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.tracing.sampling.probability=1.0
